[tools]
task = "3.40.1"
# python backs scripts/validate-frontmatter.sh (PyYAML, see requirements.txt)
python = "3.12"
uv = "0.11.7"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.deps]
description = "Provision .venv from requirements.txt"
run = "uv pip install -r requirements.txt"
sources = ["requirements.txt"]
outputs = { auto = true }
